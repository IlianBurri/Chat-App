<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="ui.css" />
    <title></title>
  </head>
  <body>
    <main class="page">
      <div class="card status" role="status" aria-live="polite">
        <div class="brand"><img src="logo.svg" alt="" /><span data-app></span></div>

        <div id="busy" hidden>
          <div class="spinner" aria-hidden="true"></div>
          <p id="busy-text"></p>
          <p class="muted small" id="busy-hint"></p>
        </div>

        <div id="error" hidden>
          <h1 data-t="error.title"></h1>
          <p class="muted" id="error-text"></p>
          <details id="details" hidden>
            <summary data-t="status.details"></summary>
            <pre id="details-text"></pre>
          </details>
          <div class="actions">
            <button type="button" class="btn" id="log" data-t="status.openLog" hidden></button>
            <button type="button" class="btn" id="settings" data-t="status.settings"></button>
            <button type="button" class="btn primary" id="retry" data-t="status.retry"></button>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="status.js"></script>
  </body>
</html>
