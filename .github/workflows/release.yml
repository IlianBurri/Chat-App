# Builds the installers on Windows, macOS and Linux, tests the install commands against them and, for a
# version tag (git tag v1.2.3 && git push origin v1.2.3), publishes a GitHub release with all files and
# SHA256SUMS.txt. Started by hand (Actions → Release → Run workflow) it only builds and tests.
#
# Code signing is optional. Without certificates Windows and macOS warn when a downloaded installer is
# opened, and macOS apps are signed ad hoc. With these repository secrets electron-builder signs:
#   CSC_LINK, CSC_KEY_PASSWORD             – certificate (.p12, base64) for macOS, or WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD for Windows
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID – notarizing on macOS
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install
        run: npm ci && npm ci --prefix desktop

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build app
        run: npm run build --prefix desktop

      - name: Build installers
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # Without a certificate: ad-hoc signature, which Apple silicon needs to start the app at all.
            sign=""
            [ -n "$CSC_LINK" ] || sign="-c.mac.identity=-"
            # One architecture at a time: both builds share node_modules, where the beforeBuild hook puts
            # the native SQLite module for the architecture being packed.
            npx electron-builder --mac --arm64 --publish never $sign
            npx electron-builder --mac --x64 --publish never $sign
          else
            npx electron-builder --publish never
          fi

      - name: Check native module architecture (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop/release
        run: |
          check() {
            archs=$(lipo -archs "$1/Contents/Resources/app/node_modules/better-sqlite3/build/Release/better_sqlite3.node")
            echo "$1: $archs"
            [ "$archs" = "$2" ]
          }
          check mac-arm64/Hallo.app arm64
          check mac/Hallo.app x86_64
          codesign --verify --deep --strict mac-arm64/Hallo.app

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb

  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Icon and checksums
        run: |
          cp desktop/build/icon.png dist/hallo-icon.png
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/*

  # Runs the real install commands from website/ against the files just built, served locally.
  test-install:
    needs: collect
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - name: Serve files
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" -m http.server 8000 --bind 127.0.0.1 --directory dist > /dev/null 2>&1 &
          sleep 2

      - name: install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          INSTALL_BASE_URL: http://127.0.0.1:8000
        run: |
          Get-Content website/install.ps1 -Raw | Invoke-Expression
          Start-Sleep -Seconds 5
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Hallo\Hallo.exe")) { throw 'Hallo.exe missing' }
          Get-Process -Name Hallo -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: install.sh (macOS)
        if: runner.os == 'macOS'
        env:
          INSTALL_BASE_URL: http://127.0.0.1:8000
        run: |
          sh website/install.sh
          test -d /Applications/Hallo.app || test -d "$HOME/Applications/Hallo.app"
          sleep 5
          pkill -x Hallo || true

      - name: install.sh (Linux, .deb via apt)
        if: runner.os == 'Linux'
        env:
          INSTALL_BASE_URL: http://127.0.0.1:8000
        run: |
          sh website/install.sh
          dpkg -s hallo | grep -E '^(Status|Version):'
          test -x /opt/Hallo/hallo
          pkill -x hallo || true

      - name: Tampered download is refused (Linux)
        if: runner.os == 'Linux'
        env:
          INSTALL_BASE_URL: http://127.0.0.1:8000
        run: |
          echo tampered >> dist/hallo-linux-amd64.deb
          if sh website/install.sh 2> err.txt; then
            echo "install.sh accepted a tampered file"; exit 1
          fi
          cat err.txt
          grep -q checksum err.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hallo ${GITHUB_REF_NAME#v}" \
            --generate-notes
